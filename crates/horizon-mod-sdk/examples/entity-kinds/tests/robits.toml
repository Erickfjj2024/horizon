[[step]]
join = "Alex"
# The message spawns a robit of the mod's own kind (declared in content): it exists as the step ends, untouched.
blocks = [{ x = 3, y = 69, z = 4, state = "minecraft:stone" }, { x = 4, y = 69, z = 4, state = "minecraft:stone" }]
net = { channel = "robits:spawn", data = [3, 0, 0, 0, 70, 0, 0, 0, 4, 0, 0, 0] }
expect.mod-entities = ["1001 robits:robit 3.500 70.000 4.500 energy=0 data=[0] skin=default name=-"]

[[step]]
# FORK-10 d: a right click on the robit is taken by the mod; sneaking, it is left to the game.
use-mod-entity = { id = 1001 }
expect.mod-entity-used = true
expect.entity-menu = ["Alex 1001"]

[[step]]
use-mod-entity = { id = 1001, sneaking = true }
expect.mod-entity-used = false

[[step]]
# One tick: the mod counted once, gave it energy and a goal a block east; it walked a first step (0.25 speed * 2.158 = 0.5395 a tick).
ticks = 1
expect.mod-entities = ["1001 robits:robit 4.040 70.000 4.500 energy=10 data=[1] skin=default name=-"]

[[step]]
# The second tick takes the red skin and arrives at the goal, which ends the walk.
ticks = 1
expect.mod-entities = ["1001 robits:robit 4.500 70.000 4.500 energy=20 data=[2] skin=red name=-"]

[[step]]
# The third names it Bolt; it stays where it arrived.
ticks = 1
expect.mod-entities = ["1001 robits:robit 4.500 70.000 4.500 energy=30 data=[3] skin=red name=Bolt"]

[[step]]
# FORK-10 f: coal lies a few tenths from the robit; in a tick the mod finds it with items-in-box, takes it with take-dropped-item
# (the item entity goes) and puts it in the robit's first slot.
dropped = [{ id = 9, stack = "minecraft:coal*3", x = 4.3, y = 70.0, z = 4.5 }, { id = 10, stack = "minecraft:stick*1", x = 40.0, y = 70.0, z = 4.5 }]
ticks = 1
expect.dropped-left = ["10 minecraft:stick*1"]
expect.mod-entity-items = ["1001 0=minecraft:coal*3"]

[[step]]
# FORK-10 e: it is red now, so a blow of 0.5 hurts for 0.25 (health 1 to 0.75), and the robit is still there.
damage-mod-entity = { id = 1001, amount = 0.5 }
expect.mod-entity-damage = 0.25
expect.mod-entities = ["1001 robits:robit 4.500 70.000 4.500 energy=40 data=[4] skin=red name=Bolt"]

[[step]]
# A blow of 4 hurts for 2: more than the health left, so it dies, the mod hears of it (its words go to the menu text under it) and it is gone.
damage-mod-entity = { id = 1001, amount = 4.0 }
expect.mod-entity-damage = 2.0
expect.mod-entities = []
expect.menu-text = ["minecraft:overworld 4 69 4 died:1001"]

[[step]]
# FORK-10 5a: a robit spawned 10 blocks over the stone falls (vanilla's gravity) and lands: 7 damage for the 7 blocks past 3, which
# the mod halves for a red robit; more than its health, so it dies and the mod hears it.
blocks = [{ x = 10, y = 69, z = 10, state = "minecraft:stone" }]
net = { channel = "robits:spawn_old", data = [10, 0, 0, 0, 80, 0, 0, 0, 10, 0, 0, 0] }
expect.mod-entities = ["1002 robits:robit 10.500 80.000 10.500 energy=0 data=[10] skin=default name=-"]

[[step]]
ticks = 30
expect.mod-entities = []
expect.menu-text = ["minecraft:overworld 10 69 10 died:1002"]

[[step]]
# FORK-10 5b: a robit on the ground (spawned past its errands, so it only stands) opens its declared menu: the 30 slots of its
# container and the 13 virtual ones of the crafting and repair tabs.
blocks = [{ x = 20, y = 69, z = 20, state = "minecraft:stone" }]
net = { channel = "robits:spawn_old", data = [20, 0, 0, 0, 70, 0, 0, 0, 20, 0, 0, 0] }
expect.mod-entities = ["1003 robits:robit 20.500 70.000 20.500 energy=0 data=[10] skin=default name=-"]

[[step]]
use-mod-entity = { id = 1003 }
expect.entity-menu = ["Alex 1003"]

[[step]]
# Follow (button 1): the mod keeps the flag, and the menu gets its data slots and its string.
entity-menu-button = { id = 1003, button = 1 }
expect.mod-entity-menu = ["1003 data=[1,0] text=following"]

[[step]]
# Two logs in the crafting grid's first slot (a step's ticks run before what the player does, so the tick is the next step's).
entity-menu-set = [{ id = 1003, slot = 30, stack = "minecraft:oak_log*2" }]
expect.mod-entity-items = ["1003 30=minecraft:oak_log*2"]

[[step]]
# In a tick the mod puts 4 planks in the result slot.
ticks = 1
expect.mod-entity-items = ["1003 30=minecraft:oak_log*2,39=minecraft:oak_planks*4"]

[[step]]
# Taking the planks (`entity-menu-taken`) uses up one log.
entity-menu-take = { id = 1003, slot = 39 }
expect.mod-entity-items = ["1003 30=minecraft:oak_log*1"]

[[step]]
# A stick in the anvil's left slot, then the menu closes: what is left in the virtual slots comes back to the player and the
# container keeps its 30 slots, empty; the flag stays in the saved bytes.
entity-menu-set = [{ id = 1003, slot = 40, stack = "minecraft:stick*1" }]
close-entity-menu = 1003
expect.entity-menu-returned = ["minecraft:oak_log*1", "minecraft:stick*1"]
expect.mod-entity-items = []
