[hardness]
"minecraft:stone" = 1.5
"minecraft:bedrock" = -1.0

[[step]]
join = "Alex"
# A block in hand: the mod's block does not use itself, the held block goes against it.
use-block = { pos = [1, 64, 1], stack = "minecraft:stone*4" }
expect.block-use = "pass"

[[step]]
# An empty hand, not sneaking: the mod takes the click.
use-block = { pos = [1, 64, 1] }
expect.block-use = "consume"

[[step]]
# Sneaking with an empty hand, or holding something else: the game does what it does.
use-block = { pos = [1, 64, 1], sneaking = true }
expect.block-use = "default"

[[step]]
use-block = { pos = [1, 64, 1], stack = "minecraft:stick*1" }
expect.block-use = "default"

[[step]]
# FORK-34: a click on the closed gate closes every capability of its entity to the outside...
use-block = { pos = [1, 70, 1] }
expect.capabilities = ["minecraft:overworld 1 70 1 items=false fluids=false energy=false"]

[[step]]
# FORK-30: a structure that has formed sparkles.
use-block = { pos = [1, 71, 1] }
expect.particles = ["minecraft:overworld minecraft:dust 1.5 71.5 1.5 8"]

[[step]]
# FORK-35: the mod stands bounding blocks for a machine (a click or a break on them reaches the machine), and tells the game it refuses
# a machine without room above it.
blocks = [{ x = 30, y = 65, z = 0, state = "minecraft:stone" }]
place-mod-block = { pos = [30, 64, 0], state = "blockuse:machine" }
expect.can-place = false
expect.redirects = ["blockuse:bound 0 1"]

[[step]]
blocks = [{ x = 30, y = 65, z = 0, state = "minecraft:air" }]
place-mod-block = { pos = [30, 64, 0], state = "blockuse:machine" }
expect.can-place = true

[[step]]
# The cardboard box: a chest beside the gate at y 72 is packed into it (gone from the world, nothing dropped)...
blocks = [{ x = 41, y = 72, z = 0, state = "minecraft:chest[facing=north]" }]
use-block = { pos = [40, 72, 0] }
expect.blocks = [{ x = 41, y = 72, z = 0, state = "minecraft:air" }]

[[step]]
# ...and put back beside the other gate, as it was.
blocks = [{ x = 41, y = 73, z = 0, state = "minecraft:air" }]
use-block = { pos = [40, 73, 0] }
expect.blocks = [{ x = 41, y = 73, z = 0, state = "minecraft:chest[facing=north]" }]

[[step]]
# In place, as the real box does: the box takes the place of the block it packs.
blocks = [{ x = 51, y = 74, z = 0, state = "minecraft:chest[facing=north]" }]
use-block = { pos = [50, 74, 0] }
expect.blocks = [{ x = 51, y = 74, z = 0, state = "blockuse:box" }]

[[step]]
# FORK-20: a click on the machine at y 75 sets the strings its menu carries.
use-block = { pos = [1, 75, 1] }
ticks = 1
expect.menu-text = ["minecraft:overworld 1 75 1 forge:ores/iron|Alex"]

[[step]]
# FORK-20: the text box (widget 7800) of the machine at 3 76 4 confirmed "forge:ores/gold": the mod answers with it as the menu's first string.
net = { channel = "blockuse:menu_text", data = [3, 0, 0, 0, 76, 0, 0, 0, 4, 0, 0, 0, 120, 30, 0, 0, 102, 111, 114, 103, 101, 58, 111, 114, 101, 115, 47, 103, 111, 108, 100] }
ticks = 1
expect.menu-text = ["minecraft:overworld 3 76 4 forge:ores/gold"]

[[step]]
# API 35: block-hardness reads the world's destroy time (stone 1.5, unlisted air 0, bedrock -1 as unbreakable).
blocks = [{ x = 6, y = 64, z = 6, state = "minecraft:stone" }]
net = { channel = "blockuse:hardness", data = [6, 0, 0, 0, 64, 0, 0, 0, 6, 0, 0, 0, 0, 0, 0, 0] }
ticks = 1
expect.menu-text = ["minecraft:overworld 6 64 6 1.5"]

[[step]]
blocks = [{ x = 6, y = 64, z = 6, state = "minecraft:bedrock" }]
net = { channel = "blockuse:hardness", data = [6, 0, 0, 0, 64, 0, 0, 0, 6, 0, 0, 0, 0, 0, 0, 0] }
ticks = 1
expect.menu-text = ["minecraft:overworld 6 64 6 -1"]

[[step]]
# API 38: a click on the machine at y 77 sets the signal a comparator reads from it.
use-block = { pos = [1, 77, 1] }
ticks = 1
expect.comparator = ["minecraft:overworld 1 77 1 9"]

[[step]]
# API 39: break-blocks answers how many blocks it will break: the stone only (the bedrock is unbreakable, the third cell is air).
blocks = [{ x = 2, y = 78, z = 1, state = "minecraft:stone" }, { x = 3, y = 78, z = 1, state = "minecraft:bedrock" }]
use-block = { pos = [1, 78, 1] }
ticks = 1
expect.broken = ["3 with minecraft:diamond_pickaxe silk=true fortune=0"]
expect.menu-text = ["minecraft:overworld 1 78 1 breaks 1"]

[[step]]
# API 41: a click on the machine at y 79 sets a line of the mod's HUD on Alex's screen.
use-block = { pos = [1, 79, 1] }
ticks = 1
expect.hud = ["Alex: blockuse:energy [minecraft:redstone] Energy: 50% 0.5"]

[[step]]
# API 42: a click on the machine at y 80 opens a radial menu of three modes on Alex's screen.
use-block = { pos = [1, 80, 1] }
ticks = 1
expect.radial = ["Alex: off=Off,vein=Vein,extended=Extended current 1"]

[[step]]
# The client sends the choice back as a message on blockuse:radial.
net = { channel = "blockuse:radial", data = [118, 101, 105, 110] }
ticks = 1
expect.told = ["Alex: mode vein"]
