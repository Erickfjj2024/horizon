[[step]]
join = "Alex"
# A block in hand: the mod's block does not use itself, the held block goes against it.
use-block = { pos = [1, 64, 1], stack = "minecraft:stone*4" }
expect.block-use = "pass"

[[step]]
# An empty hand, not sneaking: the mod takes the click.
use-block = { pos = [1, 64, 1] }
expect.block-use = "consume"

[[step]]
# Sneaking with an empty hand, or holding something else: the game does what it does.
use-block = { pos = [1, 64, 1], sneaking = true }
expect.block-use = "default"

[[step]]
use-block = { pos = [1, 64, 1], stack = "minecraft:stick*1" }
expect.block-use = "default"

[[step]]
# FORK-34: a click on the closed gate closes every capability of its entity to the outside...
use-block = { pos = [1, 70, 1] }
expect.capabilities = ["minecraft:overworld 1 70 1 items=false fluids=false energy=false"]

[[step]]
# FORK-30: a structure that has formed sparkles.
use-block = { pos = [1, 71, 1] }
expect.particles = ["minecraft:overworld minecraft:dust 1.5 71.5 1.5 8"]

[[step]]
# FORK-35: the mod stands bounding blocks for a machine (a click or a break on them reaches the machine), and tells the game it refuses
# a machine without room above it.
blocks = [{ x = 30, y = 65, z = 0, state = "minecraft:stone" }]
place-mod-block = { pos = [30, 64, 0], state = "blockuse:machine" }
expect.can-place = false
expect.redirects = ["blockuse:bound 0 1"]

[[step]]
blocks = [{ x = 30, y = 65, z = 0, state = "minecraft:air" }]
place-mod-block = { pos = [30, 64, 0], state = "blockuse:machine" }
expect.can-place = true

[[step]]
# The cardboard box: a chest beside the gate at y 72 is packed into it (gone from the world, nothing dropped)...
blocks = [{ x = 41, y = 72, z = 0, state = "minecraft:chest[facing=north]" }]
use-block = { pos = [40, 72, 0] }
expect.blocks = [{ x = 41, y = 72, z = 0, state = "minecraft:air" }]

[[step]]
# ...and put back beside the other gate, as it was.
blocks = [{ x = 41, y = 73, z = 0, state = "minecraft:air" }]
use-block = { pos = [40, 73, 0] }
expect.blocks = [{ x = 41, y = 73, z = 0, state = "minecraft:chest[facing=north]" }]
